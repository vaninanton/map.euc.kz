name: Deploy static content to Cloudflare Pages

on:
  push:
    branches: ['main']

  workflow_dispatch:

# pages: write и id-token: write были нужны только actions/deploy-pages (OIDC-обмен).
# Деплой через wrangler авторизуется своим API-токеном, прав GitHub ему не требуется.
permissions:
  contents: read

concurrency:
  group: 'deploy-production'
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  supabase:
    name: Supabase — БД и Edge Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Установить Supabase CLI
        uses: supabase/setup-cli@v3

      - name: Миграции и деплой Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push
          # --no-verify-jwt: webhook Telegram без заголовка Authorization; --use-api: сборка на стороне API без Docker на раннере
          supabase functions deploy telegram-location-bot --no-verify-jwt --use-api
          # --no-verify-jwt: OPTIONS-preflight браузера идёт без Authorization; авторизация — внутри (JWT + map_admin_users)
          supabase functions deploy ai-assist --no-verify-jwt --use-api

  deploy:
    name: Cloudflare Pages
    # Не зависит от supabase: миграции БД/edge-функций и сборка статики независимы —
    # идут параллельно. Итоговый wall-clock ≈ max(supabase, deploy) вместо суммы.
    environment:
      name: production
      url: https://map.euc.kz
    runs-on: ubuntu-latest
    # Прокидываем URL конкретного деплоя наружу: по нему job notify даёт ссылку,
    # а в дашборде Cloudflare по этому же адресу находится сборка для отката.
    outputs:
      deployment_url: ${{ steps.deployment.outputs.deployment-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        # Только vite build (без tsc): типы уже проверены job `checks` в Test-workflow
        # на PR перед merge в main. Деплой триггерится push в main → дублировать tsc незачем.
        run: npm run build
        env:
          VITE_MAPBOX_TOKEN: ${{ vars.VITE_MAPBOX_TOKEN }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_YANDEX_METRIKA_ID: ${{ vars.VITE_YANDEX_METRIKA_ID }}
          VITE_TELEGRAM_GEO_TTL_MINUTES: ${{ vars.VITE_TELEGRAM_GEO_TTL_MINUTES }}
          VITE_TELEGRAM_TRACK_TAIL_MINUTES: ${{ vars.VITE_TELEGRAM_TRACK_TAIL_MINUTES }}
          VITE_TELEGRAM_MAX_ACCURACY_METERS: ${{ vars.VITE_TELEGRAM_MAX_ACCURACY_METERS }}
          # SPA-фолбэк даёт public/_redirects (/* /index.html 200), заголовки кэша —
          # public/_headers. Оба файла Vite копирует в dist/ как есть.
      - name: Deploy to Cloudflare Pages
        id: deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          # --branch=main — production-ветка проекта: только такой деплой попадает на
          # кастомный домен map.euc.kz. --commit-dirty: не падать из-за артефактов сборки
          # в рабочей копии раннера.
          command: pages deploy dist --project-name=map-euc --branch=main --commit-dirty=true

  notify:
    name: Уведомление в Telegram
    needs: [supabase, deploy]
    # always(): джоб выполнится, даже если supabase или deploy упали или были пропущены —
    # иначе при падении в job supabase (например db push) deploy пропускается и уведомление не уходит.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram on success
        # Успех только если ОБА предыдущих джоба завершились успешно.
        if: ${{ needs.supabase.result == 'success' && needs.deploy.result == 'success' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            -d text="✅ <b>map.euc.kz</b>%0AДеплой map.euc.kz завершен успешно.%0A🔗 https://map.euc.kz%0A📦 ${{ needs.deploy.outputs.deployment_url }}"
      - name: Notify Telegram on failure
        # Любой исход кроме общего успеха: падение или отмена в supabase/deploy.
        if: ${{ needs.supabase.result != 'success' || needs.deploy.result != 'success' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            -d text="❌ <b>map.euc.kz</b>%0AДеплой map.euc.kz завершился ошибкой.%0ASupabase: ${{ needs.supabase.result }} · Cloudflare Pages: ${{ needs.deploy.result }}%0A🧾 Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
